spring.kafka.bootstrap-servers=${KAFKA_SERVER}

spring.kafka.consumer.bootstrap-servers=${KAFKA_SERVER}

# Increase Kafka reconnect backoff to reduce log noise when broker is unavailable
spring.kafka.consumer.properties.reconnect.backoff.ms=5000
spring.kafka.consumer.properties.reconnect.backoff.max.ms=60000

spring.kafka.consumer.group-id=policy-ws-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.listener.type=batch
spring.kafka.listener.ack-mode=manual

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.secufusion.tenant.dto.PolicyChangeEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.secufusion.tenant.dto
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.json.value.default.type=com.secufusion.tenant.dto.PolicyChangeEvent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false


Kafka-schedule-time=${KAFKA_SCHEDULE_TIME}
spring.application.name=${TENANT_SERVICE_NAME}
spring.config.import=optional:file:${file_path}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE}

# PostgreSQL Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Disable Open Session In View to prevent DB connections being held open
# during long-running Keycloak provisioning operations (realm creation, SSO setup etc.)
spring.jpa.open-in-view=false

# Server config
server.port=${TENANT_SERVICE_PORT}
#server.servlet.context-path=/api/tenants

# Keycloak Admin Client
keycloak.admin.server-url=${KC_ADMIN_SERVER_URL}
keycloak.admin.realm=${KC_ADMIN_REALM}
keycloak.admin.client-id=${KC_ADMIN_CLIENT_ID}
keycloak.admin.username=${KC_ADMIN_USERNAME}
keycloak.admin.password=${KC_ADMIN_PASSWORD}

# Realm and redirect URLs
realm.url=${REALM_URL}
redirect.url=${REDIRECT_URL}

# Resource server JWT validation
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI}

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api/tenants/v3/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/api/tenants/swagger-ui
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=method

# eureka.client.enabled=false
# spring.cloud.discovery.enabled=false


# SMTP email configuration
mail.smtp.host=${SMTP_HOST}
mail.smtp.port=${SMTP_PORT}
mail.smtp.auth=${SMTP_AUTH}
mail.smtp.starttls=${SMTP_STARTTLS}
mail.smtp.username=${SMTP_USERNAME}
mail.smtp.password=${SMTP_PASSWORD}
mail.smtp.mail=${SMTP_MAIL}

management.endpoints.web.exposure.include=*

# Tenant OAuth2
tenant.client-id=${TENANT_CLIENT_ID}
tenant.client-secret=${TENANT_CLIENT_SECRET}

domain.extension=${DOMAIN_EXTENSION}

# Master admin
master.admin.username=${MASTER_ADMIN_USERNAME}
master.admin.password=${MASTER_ADMIN_PASSWORD}
master.admin.firstname=${MASTER_ADMIN_FIRSTNAME}
master.admin.lastname=${MASTER_ADMIN_LASTNAME}
master.admin.domain=${MASTER_ADMIN_DOMAIN}
master.admin.email=${MASTER_ADMIN_EMAIL}
master.admin.phone=${MASTER_ADMIN_PHONE}
master.admin.tenant-name=${MASTER_ADMIN_TENANT_NAME}

# HikariCP Configuration
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_TIME}
spring.datasource.hikari.pool-name=${HIKARI_POOL_NAME}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION_THRESHOLD}

server.forward-headers-strategy=framework

azure.mismatch.validation=TRUE
azure.sso.client-id=${AZURE_CLIENT_ID}
azure.sso.client-secret=${AZURE_CLIENT_SECRET}
azure.sso.alias=${AZURE_SSO_ALIAS}
